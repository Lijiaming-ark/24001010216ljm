<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子模型、框模型，box model</title>
    <style>
        body,h2,p {
            padding: 0;
            margin: 0;
        }
        #a {
            width: 400px;
            height: 400px;
            border: 1px solid#039;
            padding: 50px 40px 30px 20px;  
            /* 上右下左 */
            margin: 40px auto;
        }
        #b {
            width: 400px;
            height: 400px;
            border: 1px dashed#039;
            margin: 50px auto 40px;
            border-left: 1px dotted#f00;
        }
        #c {
            width: 400px;
            height: 400px;
            border: 1px solid#039;
            padding: 50px 40px 30px 20px;  
            /* 上右下左 */
            margin: 40px auto;
        }
        #d {
            width: 400px;
            height: 400px;
            border: 1px solid#039;
            padding: 50px 40px 30px 20px;  
            /* 上右下左 */
            margin: 40px auto;
        }
      
    </style>    
</head>
<body>
    <h2>盒子模型、框模型,box model</h2>
    <div id="a" >216 李佳明</div>
    <div id="b" >216 李佳明</div>
    <div id="c" >216 李佳明</div>
    <div id="d" >216 李佳明</div>
</body>
</html>
