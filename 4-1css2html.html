<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2,h3,p{
            padding: 0;
            margin: 0;
        }
        #box{
            width: 480px;
            padding: 8px;
            border: 1px solid #ccc;
            font-size: 12px;
            margin: 20px;
        }
        #box h3{
            font-size: 16px;
            /* 居中 */
            text-align: center;
            /* 行高 */
            line-height: 33px;
            letter-spacing: 3px;
            color: #036;
        }
        #box p{
            color: #666;
            line-height: 150%;
            text-indent: 2em;
        }
        #box a{
            color: #f11;
            text-decoration: none;
            font-weight: bold;
        }
        /* 新增样式 */
        .stu-id{
            color: blue;
            font-weight: bold;
        }
        .stu-name{
            color: #333;
            font-weight: bold;
        }
        .level{
            color: red;
            font-weight: bold;
        }
        .knowledge{
            border: 1px solid purple;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h2>css进阶</h2>
    <div id="box">
        <h3>css那些事</h3>
        <p>
            <span class="stu-id">学号:216</span>, <span class="stu-name">姓名:李佳明</span>, 班级:计算机24002,对于《高级网页设计》课程认知为:<span class="level">中等</span>,
            这个例子对应的知识点是:<span class="knowledge">群组选择器、后代选择器、层叠与继承</span>。
            <a href="#">更多</a>
        </p>
    </div>
</body>
</html>
