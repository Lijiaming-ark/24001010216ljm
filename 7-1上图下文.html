<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      *{
          padding: 0;
          margin: 0;
      }
      ul{
          list-style: none;
      }
      img{
        display: block;
      }
      .ilist{
          display: flex;
          margin: 8px;  
        }
      .ilist li{
          width: 33.33%;
          margin-right: 1px;
          flex-grow: 1;
          position: relative;
      }

      .ilist img{
          width: 100%;
      }
      .ilist p{
          text-align: center;
          font-size: 14px;
          line-height: 33px;
          position: absolute;
          left: 0;
          
          bottom: 0;
          width: 100%;
          background-color: rgba(0,0,0,.5);
          color: #fff;
          font-weight: bold;
      }
    </style>
</head>
<body>
    <ul class="ilist">
        <li><img src="./img/a1.jpg" alt=""><p>李佳明的上图下文</p></li>
        <li><img src="./img/a2.jpg" alt=""><p>image2</p></li>
        <li><img src="./img/a3.jpg" alt=""><p>image3</p></li>
    </ul>
</body>
</html>
