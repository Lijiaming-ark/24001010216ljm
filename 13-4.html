<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>餐饮管理 · 全部功能</title>
<link rel="stylesheet" href="font/iconfont.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #eef1f5;
  display: flex;
  justify-content: center;
}
.phone {
  width: 100%;
  max-width: 430px;
  min-height: 100vh;
  background: #f5f6fa;
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: 0 0 24px rgba(0,0,0,.08);
}
.iconfont { font-size: 16px; font-style: normal; }

/* ===== 顶部导航栏 ===== */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
  background: linear-gradient(135deg, #2f6bff, #5b8cff);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.topbar .back { display: flex; align-items: center; gap: 4px; color: #fff; text-decoration: none; font-size: 16px; font-weight: 600; }
.topbar .back .iconfont { font-size: 20px; transform: rotate(180deg); }
.topbar .title { font-size: 17px; font-weight: 600; }
.top-actions { display: flex; align-items: center; gap: 18px; }
.top-actions .act { position: relative; display: flex; }
.top-actions .iconfont { font-size: 21px; }
/* 红点 */
.dot {
  position: absolute;
  top: -2px;
  right: -3px;
  width: 9px;
  height: 9px;
  background: #ff1744;
  border: 1.5px solid #4a76ff;
  border-radius: 50%;
}
/* 数字徽章 */
.badge {
  position: absolute;
  top: -7px;
  right: -10px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  background: #ff1744;
  border: 1.5px solid #4a76ff;
  border-radius: 8px;
  font-size: 10px;
  line-height: 13px;
  text-align: center;
  font-weight: 600;
}

/* ===== 分类切换（宫格筛选）===== */
.segment {
  position: sticky;
  top: calc(48px + env(safe-area-inset-top));
  z-index: 99;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  padding: 12px;
  background: #f5f6fa;
}
.segment button {
  border: none;
  outline: none;
  padding: 8px 0;
  border-radius: 18px;
  background: #fff;
  color: #666;
  font-size: 12px;
  cursor: pointer;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.segment button.active {
  background: linear-gradient(135deg, #2f6bff, #5b8cff);
  color: #fff;
}

/* ===== 功能宫格 ===== */
.panel {
  margin: 0 12px 12px;
  background: #fff;
  border-radius: 14px;
  padding: 14px 8px 10px;
}
.panel h3 { font-size: 15px; color: #222; padding: 0 8px 12px; }
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px 4px;
}
.grid .item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  padding: 6px 0;
  border-radius: 10px;
  transition: background .2s;
}
.grid .item:active { background: #f2f3f7; }
.grid .item .iconfont { font-size: 28px; }
.grid .item span { font-size: 12px; color: #555; }
.c-orange .iconfont { color: #ff7a45; }
.c-red .iconfont { color: #ff4d4f; }
.c-blue .iconfont { color: #3d7eff; }
.c-green .iconfont { color: #2fbf71; }
.c-purple .iconfont { color: #8b5cf6; }
.c-gold .iconfont { color: #f6a623; }

/* ===== 自适应 ===== */
@media (min-width: 380px) {
  .grid { grid-template-columns: repeat(4, 1fr); }
}
@media (min-width: 768px) {
  .grid { grid-template-columns: repeat(5, 1fr); }
  .panel { padding: 18px 14px 14px; }
}

/* ===== 底部 Tab 导航 ===== */
.tabbar {
  position: sticky;
  bottom: 0;
  margin-top: auto;
  z-index: 100;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: #fff;
  border-top: 1px solid #eee;
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar a {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 0 6px;
  text-decoration: none;
  color: #999;
  font-size: 11px;
}
.tabbar a .iconfont { font-size: 22px; }
.tabbar a.active { color: #2f6bff; }
.tabbar a .dot { top: 4px; right: calc(50% - 18px); border-color: #fff; }
.tabbar a .badge { top: 0; right: calc(50% - 22px); border-color: #fff; }
</style>
</head>
<body>
<div class="phone">

  <!-- 顶部导航栏：返回 + 消息红点 + 数字徽章 -->
  <header class="topbar">
    <a class="back" href="13-3.html"><i class="iconfont icon-POSzhandian"></i>首页</a>
    <div class="title">全部功能</div>
    <div class="top-actions">
      <span class="act">
        <i class="iconfont icon-chuancaiguanlihong"></i>
        <i class="dot"></i>
      </span>
      <span class="act">
        <i class="iconfont icon-dayinjiguanlihong"></i>
        <i class="badge">12</i>
      </span>
      <span class="act">
        <i class="iconfont icon-caipintiaomahong"></i>
        <i class="badge">2</i>
      </span>
    </div>
  </header>

  <!-- 分类切换 -->
  <div class="segment">
    <button class="active" data-cat="all">全部</button>
    <button data-cat="dish">菜品管理</button>
    <button data-cat="member">储值会员</button>
    <button data-cat="store">门店运维</button>
    <button data-cat="sys">系统设置</button>
  </div>

  <!-- 宫格区：菜品管理 / 储值会员 / 门店运维 / 系统设置 全部入口 -->
  <section class="panel">
    <h3 id="catTitle">全部功能</h3>
    <div class="grid" id="grid">
      <!-- 菜品管理 -->
      <a class="item c-red"  data-cat="dish" href="#"><i class="iconfont icon-caipinkuhong"></i><span>菜品库</span></a>
      <a class="item c-orange" data-cat="dish" href="#"><i class="iconfont icon-diancai"></i><span>菜品管理</span></a>
      <a class="item c-red"  data-cat="dish" href="#"><i class="iconfont icon-caileikuhong"></i><span>菜类库</span></a>
      <a class="item c-orange" data-cat="dish" href="#"><i class="iconfont icon-caipintejia"></i><span>菜品特价</span></a>
      <a class="item c-orange" data-cat="dish" href="#"><i class="iconfont icon-caipinticheng"></i><span>菜品提成</span></a>
      <a class="item c-red"  data-cat="dish" href="#"><i class="iconfont icon-caipintiaomahong"></i><span>菜品条码</span></a>
      <a class="item c-red"  data-cat="dish" href="#"><i class="iconfont icon-caipinzuofahong"></i><span>菜品做法</span></a>
      <a class="item c-gold" data-cat="dish" href="#"><i class="iconfont icon-diandanyangshi"></i><span>点单样式</span></a>
      <!-- 储值会员 -->
      <a class="item c-purple" data-cat="member" href="#"><i class="iconfont icon-changguichuzhi"></i><span>储值会员</span></a>
      <a class="item c-purple" data-cat="member" href="#"><i class="iconfont icon-changguichuzhi1"></i><span>常规储值</span></a>
      <a class="item c-purple" data-cat="member" href="#"><i class="iconfont icon-chuzhiqingsuan"></i><span>储值清算</span></a>
      <a class="item c-red"    data-cat="member" href="#"><i class="iconfont icon-chuzhituijianhong"></i><span>储值推荐</span></a>
      <!-- 门店运维 -->
      <a class="item c-blue" data-cat="store" href="#"><i class="iconfont icon-POSzhandian"></i><span>门店运维</span></a>
      <a class="item c-blue" data-cat="store" href="#"><i class="iconfont icon-POSzhandian"></i><span>POS站点</span></a>
      <a class="item c-red"  data-cat="store" href="#"><i class="iconfont icon-canzhuoguanlihong"></i><span>餐桌管理</span></a>
      <a class="item c-red"  data-cat="store" href="#"><i class="iconfont icon-chuancaiguanlihong"></i><span>传菜管理</span></a>
      <a class="item c-red"  data-cat="store" href="#"><i class="iconfont icon-dayinjiguanlihong"></i><span>打印管理</span></a>
      <a class="item c-red"  data-cat="store" href="#"><i class="iconfont icon-chupinbumenhong"></i><span>出品部门</span></a>
      <a class="item c-red"  data-cat="store" href="#"><i class="iconfont icon-danjumobanhong"></i><span>单据模板</span></a>
      <!-- 系统设置 -->
      <a class="item c-green" data-cat="sys" href="#"><i class="iconfont icon-canshushezhi"></i><span>系统设置</span></a>
      <a class="item c-red"   data-cat="sys" href="#"><i class="iconfont icon-dangkoushezhihong"></i><span>档口设置</span></a>
    </div>
  </section>

  <!-- 底部 Tab 导航（4 项） -->
  <nav class="tabbar">
    <a href="13-3.html">
      <i class="iconfont icon-diancai"></i>
      <span>首页</span>
    </a>
    <a href="13-4.html" class="active">
      <i class="iconfont icon-diandanyangshi"></i>
      <span>点餐</span>
      <i class="dot"></i>
    </a>
    <a href="#">
      <i class="iconfont icon-changguichuzhi"></i>
      <span>会员</span>
      <i class="badge">3</i>
    </a>
    <a href="#">
      <i class="iconfont icon-canshushezhi"></i>
      <span>设置</span>
    </a>
  </nav>

</div>

<script>
/* 分类筛选宫格 */
var names = { all: '全部功能', dish: '菜品管理', member: '储值会员', store: '门店运维', sys: '系统设置' };
var seg = document.querySelector('.segment');
var items = document.querySelectorAll('#grid .item');
var title = document.getElementById('catTitle');
seg.addEventListener('click', function (e) {
  var btn = e.target.closest('button[data-cat]');
  if (!btn) return;
  seg.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
  btn.classList.add('active');
  var cat = btn.dataset.cat;
  title.textContent = names[cat] || '全部功能';
  items.forEach(function (el) {
    el.style.display = (cat === 'all' || el.dataset.cat === cat) ? '' : 'none';
  });
});
</script>
</body>
</html>
